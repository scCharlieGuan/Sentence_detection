project:
  name: sentence_error_detection_thesis
  seed: 42
  log_level: INFO

task:
  name: toxicity
  text_column: response
  target_column: toxicity_copy
  supported_tasks:
    toxicity: toxicity_copy
    factual: factual_copy
    medical: medical_copy

data:
  raw_path: data/raw/CounselBench.csv
  processed_dir: data/processed_question_grouped
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15
  # All answers to the same user question remain in one partition.
  split_group_column: questionID
  spacy_model: en_core_web_sm
  min_positive_annotators: 1
  fuzzy_threshold: 0.78
  fuzzy_fallback_threshold: 0.68
  min_overlap_ratio: 0.30
  max_fuzzy_window: 3
  entire_response_values:
    - all
    - all of it
    - entire response
    - the entire response
    - whole response
    - the whole thing
    - the whole response

model:
  name: tfidf_lr
  input_mode: sentence
  pretrained_model_name: albert-base-v2
  sentence_transformer_name: BAAI/bge-base-en-v1.5
  embedding_normalization: l2
  class_weight: balanced
  num_labels: 2
  max_length: 128
  sbert_batch_size: 32
  mlp_hidden_sizes: [128]
  mlp_alpha: 0.001
  mlp_max_iter: 300

training:
  batch_size: 16
  learning_rate: 1.0e-5
  encoder_learning_rate: 1.0e-5
  head_learning_rate: 5.0e-5
  epochs: 6
  weight_decay: 0.01
  warmup_ratio: 0.10
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  mixed_precision: true
  use_patience: true
  patience: 2
  freeze_strategy: full
  unfreeze_last_groups: 1
  loss: cross_entropy
  focal_gamma: 2.0
  imbalance_method: none
  threshold_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  threshold_metric: f1
  primary_selection_metric: pr_auc
  train_final_on_train_val: false
  hyperparameter_tuning:
    enabled: true
    cv_folds: 5
    scoring: average_precision
    n_jobs: 2
    verbose: 0
    grid_search_models:
      - tfidf_lr
      - tfidf_linear_svm
      - sbert_lr
    random_search_models: []
    models:
      tfidf_lr:
        params:
          tfidf__ngram_range: [[1, 1], [1, 2]]
          tfidf__min_df: [2, 5]
          clf__C: [0.01, 0.1, 1.0, 10.0]
      tfidf_linear_svm:
        params:
          tfidf__ngram_range: [[1, 1], [1, 2]]
          tfidf__min_df: [2, 5]
          clf__estimator__C: [0.01, 0.1, 1.0, 10.0]
      sbert_lr:
        params:
          C: [0.01, 0.1, 1.0, 10.0]

output:
  model_dir: models/thesis
  report_dir: reports/thesis
  save_models: true
