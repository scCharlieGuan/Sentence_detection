project:
  name: sentence_error_detection
  seed: 42
  log_level: INFO

task:
  name: toxicity
  text_column: response
  target_column: toxicity_copy
  supported_tasks:
    toxicity: toxicity_copy
    factual: factual_copy
    medical: medical_copy

data:
  raw_path: data/raw/CounselBench.csv
  processed_dir: data/processed
  train_size: 0.70
  validation_size: 0.15
  test_size: 0.15
  spacy_model: en_core_web_sm
  min_positive_annotators: 1
  fuzzy_threshold: 0.78
  fuzzy_fallback_threshold: 0.68
  min_overlap_ratio: 0.30
  max_fuzzy_window: 3
  entire_response_values:
    - all
    - all of it
    - entire response
    - the entire response
    - whole response
    - the whole thing
    - the whole response

model:
  name: tfidf_lr
  pretrained_model_name: albert-base-v2
  sentence_transformer_name: BAAI/bge-base-en-v1.5
  num_labels: 2
  max_length: 256
  sbert_batch_size: 32

training:
  batch_size: 16
  learning_rate: 2.0e-5
  epochs: 3
  weight_decay: 0.01
  patience: 2
  threshold_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  primary_selection_metric: pr_auc_lift
  train_final_on_train_val: true
  class_weight: balanced

output:
  model_dir: models
  report_dir: reports
  save_models: true
